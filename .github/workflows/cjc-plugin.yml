name: CJC Plugin Validation

on:
  push:
    branches:
      - feature/cjc-plugin
    paths:
      - 'plugins/cjc/**'
      - '.github/workflows/cjc-plugin.yml'
  pull_request:
    paths:
      - 'plugins/cjc/**'
      - '.github/workflows/cjc-plugin.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find plugins/cjc -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in plugins/cjc/dist/*.js; do
            node --check "$file"
          done

      - name: Validate JSON manifests
        shell: bash
        run: |
          set -euo pipefail
          php -r '
            foreach (["plugins/cjc/plugin.json", "plugins/cjc/dist/ui.manifest.json"] as $file) {
              json_decode(file_get_contents($file), true, 512, JSON_THROW_ON_ERROR);
              echo $file." OK\n";
            }
          '
